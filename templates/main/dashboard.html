{% extends 'base.html' %}

{% block title %}Dashboard - CheckMate{% endblock %}

{% block extra_head %}
<!-- Fonts & UI Libraries -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tsparticles@3/tsparticles.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.2/dist/vanilla-tilt.min.js"></script>

<style>
  /* —— Layout —— */
  body {
    margin: 0;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    font-family: 'Poppins', sans-serif;
    color: #fff;
    overflow-x: hidden;
  }

  #tsparticles {
    position: fixed;
    inset: 0;
    z-index: -1;
  }

  /* —— Base Glass Card —— */
  .glass-card {
    position: relative;
    background: rgba(255, 255, 255, 0.15); /* faint glass */
    border: 1px solid rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 16px; /* Rounded corners */
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    transition: transform 0.45s cubic-bezier(0.25, 1, 0.3, 1), box-shadow 0.45s;
  }

  .glass-card:hover { 
    transform: translateY(-8px) scale(1.03); 
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); 
  }

  /* —— Metric Cards —— */
  .metric-card { position: relative; }
  .metric-card .card-body { position: relative; z-index: 1; }
  .metric-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background-size: 200% 200%;
    animation: bgShift 8s ease infinite;
    z-index: 0;
  }

  /* Individual pastel gradient backgrounds for content cards */
  .metric-purple::before { background: linear-gradient(135deg, #b3a0f0 0%, #d0b7f6 100%); }
  .metric-pink::before   { background: linear-gradient(135deg, #ffb3d9 0%, #fdd6e5 100%); }
  .metric-aqua::before   { background: linear-gradient(135deg, #a0eaff 0%, #b5d8f6 100%); }
  .metric-gold::before   { background: linear-gradient(135deg, #fdd5a0 0%, #f7d7b9 100%); }

  @keyframes bgShift { 
    0% {background-position: 0 50%;} 
    50% {background-position: 100% 50%;} 
    100% {background-position: 0 50%;}
  }

  /* —— Typography —— */
  .card-body h4 { font-size: 2rem; font-weight: 600; margin-bottom: 0.25rem; }
  .card-body p { font-size: 1.1rem; margin: 0; font-weight: 400; }
  .dashboard-title { font-size: 2.6rem; font-weight: 700; text-shadow: 2px 2px 6px rgba(0,0,0,0.4); }

  /* —— List & Headers —— */
  .list-group-item { background: transparent; border: none; color: #fff; padding: 12px 0; }
  .list-group-item i { margin-right: 8px; }
  .card-header { background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.2); font-weight: 600; font-size: 1.1rem; }

  /* —— Buttons —— */
  .btn-glass {
    position: relative;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    backdrop-filter: blur(10px);
    border-radius: 16px; /* Rounded corners */
    font-weight: 500;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s;
  }
  .btn-glass::after {
    content: "";
    position: absolute;
    inset: -100% -100% 0 0;
    background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.5) 60%, transparent 100%);
    transform: translateX(-100%);
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn-glass:hover::after { transform: translateX(100%); }
  .btn-glass:hover { transform: translateY(-3px); box-shadow: 0 4px 18px rgba(0,0,0,0.4); }

  /* —— Charts —— */
  #accuracyChart { width: 100%; max-height: 220px; }

  @media(max-width: 767px){ .dashboard-title { font-size: 2.1rem; } }
</style>
{% endblock %}

{% block content %}
<div id="tsparticles"></div>

<div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
  <h1 class="dashboard-title d-flex align-items-center"><i class="fas fa-tachometer-alt me-3"></i> Dashboard</h1>
  <a href="{% url 'main:grade_test' %}" class="btn btn-glass d-flex align-items-center"><i class="fas fa-bolt me-2"></i> Quick Grade</a>
</div>
{% endblock %}

{% block extra_js %}
<script>
  /* —— Particles —— */
  tsParticles.load("tsparticles", {
    fullScreen:{enable:false}, background:{color:"transparent"},
    particles:{number:{value:60},size:{value:3},move:{enable:true,speed:1},opacity:{value:0.5},color:{value:"#ffffff"},links:{enable:true,color:"#ffffff",opacity:0.25}},
    interactivity:{events:{onhover:{enable:true,mode:"repulse"},onclick:{enable:true,mode:"push"}},modes:{repulse:{distance:100},push:{quantity:4}}}
  });

  /* —— Doughnut —— */
  const ctx=document.getElementById('accuracyChart');
  if(ctx){new Chart(ctx,{type:'doughnut',data:{labels:['Accuracy',''],datasets:[{data:[87,13],backgroundColor:['rgba(255,255,255,0.9)','rgba(255,255,255,0.15)'],borderWidth:0}]},options:{cutout:'75%',plugins:{tooltip:{enabled:false},legend:{display:false}}}});}

  /* —— Tilt —— */
  VanillaTilt.init(document.querySelectorAll('[data-tilt]'),{max:8,speed:600});
</script>
{% endblock %}
