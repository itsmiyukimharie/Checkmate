{% extends 'base.html' %}

{% block title %}Review Processed Sheets - CheckMate{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="fw-bold mb-4"><i class="fas fa-file-alt"></i> Review Processed Sheets</h1>
    <div id="resultsContainer">
        <!-- Results will be loaded here by JavaScript -->
    </div>
    <div class="mt-3">
        <a href="{% url 'main:grade_test' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Grading
        </a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Retrieve grading results from sessionStorage
    const results = sessionStorage.getItem('gradingResults');
    const container = document.getElementById('resultsContainer');
    if (results) {
        try {
            const data = JSON.parse(results);
            // Display JSON as a formatted string for now
            container.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger">Failed to load results.</div>';
        }
    } else {
        container.innerHTML = '<div class="alert alert-warning">No grading results found. Please process answer sheets first.</div>';
    }
});
</script>
{% endblock %}
