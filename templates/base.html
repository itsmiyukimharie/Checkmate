<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CheckMate{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #2c3e50;
        }
        .sidebar .nav-link {
            color: #ecf0f1;
            border-radius: 5px;
            margin: 2px 0;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #34495e;
            color: white;
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 sidebar">
                <div class="p-3">
                    <h4 class="text-white mb-4">
                        <i class="fas fa-check-circle"></i> CheckMate
                    </h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if current_page == 'dashboard' %}active{% endif %}" href="{% url 'main:dashboard' %}">
                                <i class="fas fa-tachometer-alt"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if current_page == 'test_overview' %}active{% endif %}" href="{% url 'main:test_overview' %}">
                                <i class="fas fa-clipboard-list"></i> Test Overview
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if current_page == 'answer_keys' %}active{% endif %}" href="{% url 'main:answer_keys' %}">
                                <i class="fas fa-key"></i> Answer Keys
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if current_page == 'grade_test' %}active{% endif %}" href="{% url 'main:grade_test' %}">
                                <i class="fas fa-graduation-cap"></i> Grade Test
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if current_page == 'export_results' %}active{% endif %}" href="{% url 'main:export_results' %}">
                                <i class="fas fa-download"></i> Export Results
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if current_page == 'analytics' %}active{% endif %}" href="{% url 'main:analytics' %}">
                                <i class="fas fa-chart-bar"></i> Analytics
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-10 main-content">
                <div class="p-4">
                    {% block content %}
                    {% endblock %}
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
